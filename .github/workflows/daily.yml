name: Daily job update

on:
  schedule:
    # GitHub starts scheduled runs late at busy times (on 2026-11-24 by ~8 hours),
    # so the workflow is triggered every 30 minutes from 16:00 to 21:30 UTC.
    # The script sends on the first run from 19:00 Israel time and records the
    # date in seen.json; every later run that day stops right away.
    - cron: "0,30 16-21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # to save seen.json (first-seen dates) back to the repo

concurrency:
  group: daily-job-update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python job_agent.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save first-seen state
        run: |
          if [ -f seen.json ] && [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "Update first-seen state"
            git push
          fi
